name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # 驗收 4：同一份資料由 macOS 與 Windows 各備份一次到同一個備份庫
  cross-os-first:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python benchmarks/cross_os_dedup.py first --repo "$RUNNER_TEMP/repo" --data "$RUNNER_TEMP/family-data"
      - uses: actions/upload-artifact@v7
        with:
          name: shared-repo
          path: ${{ runner.temp }}/repo
          retention-days: 1

  cross-os-second:
    needs: cross-os-first
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - uses: actions/download-artifact@v8
        with:
          name: shared-repo
          path: ${{ runner.temp }}/repo
      - run: uv run python benchmarks/cross_os_dedup.py second --repo "${{ runner.temp }}/repo" --data "${{ runner.temp }}/family-data"
